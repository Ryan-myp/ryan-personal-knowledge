name: Ryan Ad Agent
language: python

security:
  max_severity: info
  ignore_patterns:
    - test_*.py
    - conftest.py
    - build/**
    - "**/build/**"
    - dist/**
    - "**/dist/**"
    - "*.egg-info/**"
    - "**/*.egg-info/**"

code_quality:
  max_function_length: 50
  max_nesting_depth: 4
  max_parameters: 7
  max_line_length: 100
  require_docstrings: false

quality_gate:
  max_critical: 0
  max_high: 5
  max_warning: 20
  max_info: 100
  min_confidence: 0.7
  forbidden_rules: []
