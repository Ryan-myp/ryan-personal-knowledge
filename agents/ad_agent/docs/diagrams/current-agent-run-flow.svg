<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1180" width="1440" height="1180">
  <style>
    text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .title { fill: #111827; font-size: 28px; font-weight: 700; }
    .subtitle { fill: #6b7280; font-size: 14px; }
    .label { fill: #111827; font-size: 14px; font-weight: 700; }
    .copy { fill: #4b5563; font-size: 11px; }
    .small { fill: #6b7280; font-size: 10px; }
    .tag { font-size: 9px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#16a34a"/>
    </marker>
    <marker id="arrerror" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#dc2626"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ea580c"/>
    </marker>
  </defs>
  <rect width="1440" height="1180" fill="#f8fafc"/>
  <text x="52" y="52" class="title">一次 Agent Run 的核心流程</text>
  <text x="52" y="78" class="subtitle">身份与生命周期由通用 Runtime 管；广告应用只提供上下文、策略、工具和渠道实现</text>

  <!-- Main path connectors -->
  <g fill="none" stroke="#2563eb" stroke-width="2">
    <path d="M720 167 L720 189" marker-end="url(#arrow-blue)"/>
    <path d="M720 269 L720 291" marker-end="url(#arrow-blue)"/>
    <path d="M720 371 L720 393" marker-end="url(#arrow-blue)"/>
    <path d="M720 483 L720 505" marker-end="url(#arrow-blue)"/>
    <path d="M720 585 L720 607" marker-end="url(#arrow-blue)"/>
  </g>

  <!-- Request -->
  <g>
    <rect x="510" y="103" width="420" height="64" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text x="720" y="129" text-anchor="middle" class="label">用户请求</text>
    <text x="720" y="149" text-anchor="middle" class="copy">聊天文本 + 可选账户 / 模板 / 确认载荷</text>
  </g>

  <!-- API identity -->
  <g>
    <rect x="510" y="189" width="420" height="80" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="532" y="216" class="label">API 认证与请求边界</text>
    <text x="532" y="238" class="copy">X-API-Key → trusted principal / tenant；不信任 body.user_id</text>
    <text x="532" y="255" class="copy">校验确认载荷；/chat 或 /chat/stream 调用同一 Runtime</text>
  </g>

  <!-- Kernel -->
  <g>
    <rect x="510" y="291" width="420" height="80" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="532" y="318" class="label">通用 Run Kernel</text>
    <text x="532" y="340" class="copy">生成 run_id / turn_id · 解析 mode · session 并发锁 / durable lease</text>
    <text x="532" y="357" class="copy">恢复 transcript/checkpoint；检查取消与 lease 状态</text>
  </g>

  <!-- Context -->
  <g>
    <rect x="510" y="393" width="420" height="90" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="532" y="420" class="label">构建有限上下文</text>
    <text x="532" y="442" class="copy">相关 Skills + Tool 描述 + 会话摘要</text>
    <text x="532" y="461" class="copy">Knowledge Wiki 检索 + Memory recall（均为 advisory context）</text>
    <rect x="813" y="407" width="94" height="22" rx="4" fill="#dcfce7"/>
    <text x="860" y="422" text-anchor="middle" class="tag" fill="#166534">≤ BUDGET</text>
  </g>

  <!-- LLM -->
  <g>
    <rect x="510" y="505" width="420" height="80" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.2"/>
    <rect x="515" y="510" width="410" height="70" rx="7" fill="none" stroke="#93c5fd" stroke-width="0.8"/>
    <text x="720" y="535" text-anchor="middle" class="label">Model Adapter：一个模型回合</text>
    <text x="720" y="557" text-anchor="middle" class="copy">返回自然语言回复，或结构化 Tool Calls</text>
    <text x="720" y="574" text-anchor="middle" class="small">Agent 保持单一循环；Tool 结果会进入下一回合</text>
  </g>

  <!-- Decision -->
  <g>
    <path d="M720 607 L810 657 L720 707 L630 657 Z" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="720" y="653" text-anchor="middle" class="label">有 Tool Call?</text>
    <text x="720" y="671" text-anchor="middle" class="small">模型决定结束或请求能力</text>
  </g>

  <!-- No-tool final path -->
  <g fill="none" stroke="#16a34a" stroke-width="2">
    <path d="M630 657 L302 657 L302 754" marker-end="url(#arrow-green)"/>
  </g>
  <g>
    <rect x="175" y="754" width="255" height="84" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="302" y="783" text-anchor="middle" class="label">直接回复</text>
    <text x="302" y="805" text-anchor="middle" class="copy">无外部 Tool 副作用</text>
    <text x="302" y="822" text-anchor="middle" class="small">收尾 Run 并返回用户</text>
    <rect x="443" y="643" width="54" height="24" rx="4" fill="#f8fafc"/>
    <text x="470" y="660" text-anchor="middle" class="tag" fill="#166534">否</text>
  </g>

  <!-- Tool path -->
  <g fill="none" stroke="#2563eb" stroke-width="2">
    <path d="M810 657 L1090 657 L1090 686" marker-end="url(#arrow-blue)"/>
  </g>
  <g>
    <rect x="998" y="643" width="54" height="24" rx="4" fill="#f8fafc"/>
    <text x="1025" y="660" text-anchor="middle" class="tag" fill="#1d4ed8">是</text>
  </g>

  <!-- Tool coordinator and policy -->
  <g>
    <rect x="890" y="686" width="400" height="82" rx="8" fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
    <text x="912" y="713" class="label">Tool Coordinator</text>
    <text x="912" y="735" class="copy">Registry 查找 · Schema 校验 · 依赖排序 · 有界并发 / 超时</text>
    <text x="912" y="752" class="copy">Tool 输出限长；仅安全读操作按声明策略重试</text>
    <path d="M1090 768 L1090 791" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  </g>
  <g>
    <rect x="890" y="791" width="400" height="104" rx="8" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5"/>
    <text x="912" y="818" class="label">统一 Policy / Safety Gates</text>
    <text x="912" y="840" class="copy">权限 · 账户白名单 · dry_run/live fuse · 显式确认</text>
    <text x="912" y="859" class="copy">幂等 reservation · 审计 · provider client 可用性</text>
    <text x="912" y="879" class="small">不通过 / 缺信息 → 返回澄清或确认，不触发写调用</text>
  </g>

  <!-- Policy branch to clarification -->
  <g fill="none" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="5 4">
    <path d="M890 845 L770 845"/>
  </g>
  <g>
    <rect x="705" y="831" width="65" height="26" rx="4" fill="#fef2f2" stroke="#fecaca"/>
    <text x="737" y="848" text-anchor="middle" class="tag" fill="#b91c1c">阻止/确认</text>
    <path d="M705 844 L555 844 L555 899" fill="none" stroke="#dc2626" stroke-width="1.7" stroke-dasharray="5 4" marker-end="url(#arrerror)"/>
    <rect x="425" y="899" width="260" height="72" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="555" y="927" text-anchor="middle" class="label">澄清 / 确认卡</text>
    <text x="555" y="949" text-anchor="middle" class="copy">等待用户输入后继续同一会话</text>
  </g>

  <!-- Executor / provider -->
  <g>
    <path d="M1090 895 L1090 920" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <rect x="890" y="920" width="400" height="74" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
    <text x="912" y="948" class="label">Tool Executor → 渠道 API</text>
    <text x="912" y="971" class="copy">Local / SDK-HTTP / MCP → Google Ads · Meta · TikTok</text>
  </g>

  <!-- Results and loop -->
  <g>
    <path d="M1090 994 L1090 1016" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow-orange)"/>
    <rect x="890" y="1016" width="400" height="78" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="912" y="1044" class="label">结果归一化、脱敏与持久化</text>
    <text x="912" y="1066" class="copy">Run Events / checkpoint / conversation trace；追加 Tool result</text>
    <text x="912" y="1084" class="small">然后回到 Model Adapter 继续下一回合，或输出最终回复</text>
    <path d="M1290 1055 L1370 1055 L1370 560 L944 560 L930 560"
          fill="none" stroke="#2563eb" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrow-blue)"/>
    <rect x="1192" y="548" width="160" height="24" rx="4" fill="#f8fafc"/>
    <text x="1272" y="565" text-anchor="middle" class="tag" fill="#1d4ed8">Tool result → 下一回合</text>
  </g>

  <!-- Failure semantics -->
  <g>
    <rect x="52" y="1002" width="730" height="92" rx="8" fill="#ffffff" stroke="#d1d5db"/>
    <text x="72" y="1029" class="label">失败语义</text>
    <text x="72" y="1052" class="copy">读超时：按策略重试；写超时：结果未知，必须 reconcile，不能盲目重试。</text>
    <text x="72" y="1074" class="copy">取消 / lease 丢失 / 持久化失败：标记 recovery_required，保留恢复线索。</text>
  </g>

  <text x="52" y="1154" class="small">注意：该图描述代码执行边界；Provider E2E、写操作覆盖与生产部署的验证成熟度仍需单独看证据。</text>
</svg>
