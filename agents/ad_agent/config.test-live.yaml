# Local test-account deployment. The page controls each user's dry_run/live mode.
# Requires the separate AD_AGENT_ENABLE_LIVE=1 deployment opt-in.
execution_mode: dry_run
execution_timeout_seconds: 500
read_only_mode: false
allow_live_writes: true

# Shared identity may read accounts authorized by the connected credentials.
# This does not grant writes; allowed_accounts remains the mutation allowlist.
provider_read_namespaces: ["google-ads", "meta", "tiktok"]

allowed_accounts:
  google-ads: ["9055507554", "7574609568"]
  meta: ["2806375919473667"]
  tiktok: ["7397068114548195329"]

# Supported campaign hierarchy writes only, always gated by the test allowlist,
# explicit live opt-in, confirmation and idempotency. Other resources stay read-only.
# Tools without a declared live adapter are intentionally not approved here.
