# ad-agent 配置文件
# 测试账户白名单 + 模式配置

# 受控测试账户白名单（查询、dry-run 计划和后续手动 live 测试均需命中）
allowed_accounts:
  meta:
    - "2806375919473667"
  google-ads:
    - "9055507554"
  tiktok:
    - "7397068114548195329"
  dv360:
    - "5110831"

# 运行模式: dry_run | read_only | live
# dry_run: 支持完整规划与参数校验，但不调用线上写 API
# live 还必须由 AD_AGENT_ENABLE_LIVE=1 显式解锁，并命中下方工具白名单。
execution_mode: dry_run
read_only_mode: false
# Second, deployment-level fuse for provider mutations. Keep false until a
# manually selected test-account run is approved.
allow_live_writes: false
live_approved_tools: []

# Runtime permission baseline.  ads.write must be added explicitly together
# with AD_AGENT_ENABLE_LIVE=1 and live_approved_tools before any live write.
granted_permissions:
  - ads.read
  - ads.plan
  # Skill management is a control-plane capability and does not grant any
  # Provider API access. Keep its read/write/evaluation gates explicit so the
  # local management UI can use its complete lifecycle.
  - skills.read
  - skills.write
  - skills.evaluate
  - knowledge.read
  - knowledge.write
  # MCP control-plane access is separate from external Tool write access.
  # mcp.write remains intentionally absent; enabling a remote write Tool does
  # not grant it execution permission.
  - mcp.read
  - mcp.manage

# For multi-user HTTP deployments prefer AD_AGENT_API_KEY_PRINCIPALS, whose
# values contain trusted user_id/tenant_id/permissions/account_scope claims.
# The request body's user_id is never an authorization source.

# LLM 配置（必需；Agent 不提供无 LLM 的规则解析运行模式）
models:
  default: "agnes-2.5-flash"
  openai:
    base_url: ""  # 留空使用默认

# 日志级别: DEBUG | INFO | WARNING | ERROR
log_level: INFO

# Storage is selected by environment so the checked-in default remains safe
# for local single-process development. Set AD_AGENT_DATABASE_URL to enable
# the MySQL/InnoDB backend for shared multi-instance deployment.
# database:
#   backend: mysql
#   url: mysql+pymysql://user:password@127.0.0.1:3306/ad_agent
