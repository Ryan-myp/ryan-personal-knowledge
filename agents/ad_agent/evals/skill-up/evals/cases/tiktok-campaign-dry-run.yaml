id: tiktok-campaign-dry-run
title: TikTok App campaign waits for its declared creation inputs
tag: functional_test
input:
  prompt: "创建 TikTok campaign; account_id=7397068114548195329; name=skill-up-app; objective_type=APP_PROMOTION; campaign_type=REGULAR_CAMPAIGN; budget_mode=BUDGET_MODE_DAY; daily_budget=100; app_promotion_type=APP_ACQUISITION"
expect:
  exit_code: 0
  must_contain:
    - "tiktok_smart_plus_create_campaign"
    - '"needs_input": true'
    - '"results": []'
  must_not_contain:
    - "provider_unavailable"
judge:
  type: rule_based
  success:
    - output_contains:
        all: ["tiktok_smart_plus_create_campaign", "needs_input", "results"]
  failure:
    - output_contains:
        any: ["access_token", "client_secret", "Authorization:"]
expect:
  structured:
    intent_type: create_campaign
    platforms: [tiktok]
    needs_input: true
    needs_confirmation: false
    results_empty: true
