<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ad-agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #252525;
            --bg-tertiary: #2f2f2f;
            --bg-hover: #383838;
            --text-primary: #e8e8e8;
            --text-secondary: #9a9a9a;
            --text-muted: #666;
            --accent: #10a37f;
            --accent-hover: #0d8c6d;
            --border: #333;
            --user-bubble: #2f2f2f;
            --agent-bubble: transparent;
            --error: #f85149;
            --warning: #d29922;
            --success: #3fb950;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Header */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-secondary);
        }
        
        .header-logo {
            width: 32px;
            height: 32px;
            background: linear-gradient(135deg, var(--accent), #0d8c6d);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .header-title {
            font-size: 16px;
            font-weight: 500;
        }
        
        .header-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
        }
        
        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        
        .message {
            display: flex;
            gap: 12px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }
        
        .message.user {
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }
        
        .message.agent .message-avatar {
            background: var(--accent);
        }
        
        .message.user .message-avatar {
            background: var(--bg-tertiary);
        }
        
        .message-content {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 15px;
        }
        
        .message.user .message-content {
            background: var(--user-bubble);
            border-top-right-radius: 4px;
        }
        
        .message.agent .message-content {
            background: var(--agent-bubble);
            border-top-left-radius: 4px;
        }
        
        .message.error .message-content {
            background: rgba(248, 81, 73, 0.1);
            color: var(--error);
            border: 1px solid rgba(248, 81, 73, 0.3);
        }
        
        .message.tool-result {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
        }
        
        .message.tool-result pre {
            white-space: pre-wrap;
            word-break: break-all;
        }
        
        .message-tools {
            margin-top: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        
        .tool-tag {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        
        .tool-tag.success {
            color: var(--success);
            background: rgba(63, 185, 80, 0.1);
        }
        
        .tool-tag.error {
            color: var(--error);
            background: rgba(248, 81, 73, 0.1);
        }
        
        /* Quick Actions */
        .quick-actions {
            padding: 12px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: var(--bg-secondary);
        }
        
        .quick-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            color: var(--text-primary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .quick-btn:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
        }
        
        /* Input Area */
        .input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border);
            background: var(--bg-secondary);
        }
        
        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }
        
        .input-box {
            width: 100%;
            padding: 14px 50px 14px 18px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            outline: none;
            min-height: 52px;
            max-height: 150px;
            line-height: 1.5;
        }
        
        .input-box:focus {
            border-color: var(--accent);
        }
        
        .input-box::placeholder {
            color: var(--text-muted);
        }
        
        .send-btn {
            position: absolute;
            right: 12px;
            bottom: 12px;
            width: 32px;
            height: 32px;
            background: var(--accent);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        
        .send-btn:hover {
            background: var(--accent-hover);
        }
        
        .send-btn:disabled {
            background: var(--bg-hover);
            cursor: not-allowed;
        }
        
        /* Confirmation Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            max-width: 480px;
            width: 90%;
        }
        
        .modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .modal-title.warning {
            color: var(--warning);
        }
        
        .modal-body {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }
        
        .modal-actions {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }
        
        .modal-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .modal-btn.cancel {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }
        
        .modal-btn.confirm {
            background: var(--accent);
            color: white;
        }
        
        .modal-btn.confirm:hover {
            background: var(--accent-hover);
        }
        
        .modal-btn.danger {
            background: var(--error);
            color: white;
        }
        
        /* Loading */
        .loading-dots {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
        }
        
        .loading-dots span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
        .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--bg-hover);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }
        
        /* Welcome */
        .welcome {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        
        .welcome h2 {
            font-size: 24px;
            font-weight: 500;
            margin-bottom: 12px;
            color: var(--text-primary);
        }
        
        .welcome p {
            font-size: 15px;
            line-height: 1.6;
        }
        
        .platform-badges {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
        
        .platform-badge {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-logo">A</div>
        <div class="header-title">ad-agent</div>
        <div class="header-status">
            <span class="status-dot"></span>
            <span id="statusText">已连接</span>
        </div>
    </div>
    
    <!-- Chat Container -->
    <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcomeMessage">
            <h2>欢迎使用 ad-agent</h2>
            <p>我是您的广告投放专家助手，支持 Meta、TikTok、Google Ads、DV360 四大平台。</p>
            <div class="platform-badges">
                <span class="platform-badge">📘 Meta</span>
                <span class="platform-badge">🎵 TikTok</span>
                <span class="platform-badge">🔍 Google Ads</span>
                <span class="platform-badge">📺 DV360</span>
            </div>
        </div>
    </div>
    
    <!-- Quick Actions -->
    <div class="quick-actions">
        <button class="quick-btn" onclick="setInput('帮我列出 Meta 账户')">📘 列出 Meta 账户</button>
        <button class="quick-btn" onclick="setInput('创建 TikTok 广告系列')">🎵 创建 TikTok Campaign</button>
        <button class="quick-btn" onclick="setInput('查询 Google Ads 报表')">🔍 查看报表</button>
        <button class="quick-btn" onclick="setInput('创建 DV360 广告系列')">📺 创建 DV360 Campaign</button>
        <button class="quick-btn" onclick="setInput('跨渠道预算优化')">⚡ 预算优化</button>
    </div>
    
    <!-- Input Area -->
    <div class="input-area">
        <div class="input-wrapper">
            <textarea 
                class="input-box" 
                id="userInput" 
                placeholder="输入您的需求，例如：帮我创建一个 Meta 广告系列..."
                rows="1"
                onkeydown="handleKeyDown(event)"
                oninput="autoResize(this)"
            ></textarea>
            <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Confirmation Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal">
            <div class="modal-title warning">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                    <line x1="12" y1="9" x2="12" y2="13"></line>
                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                </svg>
                确认执行写入操作
            </div>
            <div class="modal-body" id="confirmBody">
                这将创建广告系列，是否继续？
            </div>
            <div class="modal-actions">
                <button class="modal-btn cancel" onclick="cancelConfirm()">取消</button>
                <button class="modal-btn confirm" id="confirmBtn" onclick="confirmAction()">确认执行</button>
            </div>
        </div>
    </div>
    
    <script>
        let pendingRequest = null;
        let sessionId = null;
        
        // Auto-resize textarea
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
        }
        
        // Set input from quick actions
        function setInput(text) {
            document.getElementById('userInput').value = text;
            document.getElementById('userInput').focus();
            autoResize(document.getElementById('userInput'));
        }
        
        // Handle Enter key
        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }
        
        // Add message to chat
        function addMessage(content, type = 'agent', tools = null, isError = false) {
            const container = document.getElementById('chatContainer');
            const welcome = document.getElementById('welcomeMessage');
            if (welcome) welcome.remove();
            
            const msg = document.createElement('div');
            msg.className = `message ${type}${isError ? ' error' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = type === 'user' ? '👤' : '🤖';
            
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';
            
            if (tools) {
                const text = document.createElement('div');
                text.innerHTML = content;
                messageContent.appendChild(text);
                
                const toolTags = document.createElement('div');
                toolTags.className = 'message-tools';
                tools.forEach(t => {
                    const tag = document.createElement('span');
                    tag.className = `tool-tag ${t.success ? 'success' : 'error'}`;
                    tag.textContent = `${t.tool} ${t.success ? '✓' : '✗'}`;
                    toolTags.appendChild(tag);
                });
                messageContent.appendChild(toolTags);
            } else {
                messageContent.textContent = content;
            }
            
            msg.appendChild(avatar);
            msg.appendChild(messageContent);
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            
            return msg;
        }
        
        // Add loading indicator
        function addLoading() {
            const container = document.getElementById('chatContainer');
            const msg = document.createElement('div');
            msg.className = 'message agent';
            msg.id = 'loadingMsg';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = '🤖';
            
            const content = document.createElement('div');
            content.className = 'message-content loading-dots';
            content.innerHTML = '<span></span><span></span><span></span>';
            
            msg.appendChild(avatar);
            msg.appendChild(content);
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }
        
        // Remove loading indicator
        function removeLoading() {
            const loading = document.getElementById('loadingMsg');
            if (loading) loading.remove();
        }
        
        // Show confirmation modal
        function showConfirm(payload, callback) {
            pendingRequest = { payload, callback };
            document.getElementById('confirmBody').textContent = payload.description || '确认执行此操作？';
            document.getElementById('confirmModal').classList.add('active');
        }
        
        // Cancel confirmation
        function cancelConfirm() {
            document.getElementById('confirmModal').classList.remove('active');
            pendingRequest = null;
            addMessage('❌ 操作已取消', 'agent');
        }
        
        // Confirm action
        async function confirmAction() {
            document.getElementById('confirmModal').classList.remove('active');
            if (pendingRequest) {
                const { callback } = pendingRequest;
                pendingRequest = null;
                if (callback) callback();
            }
        }
        
        // Send message
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;
            
            input.value = '';
            input.style.height = 'auto';
            
            addMessage(text, 'user');
            addLoading();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_input: text,
                        user_id: 'web_user',
                        session_id: sessionId,
                        account_id: '2806375919473667'  // Test account
                    })
                });
                
                const data = await response.json();
                removeLoading();
                
                if (data.error) {
                    addMessage(data.error, 'agent', null, true);
                    return;
                }
                
                sessionId = data.session_id;
                
                // Check if confirmation is needed
                if (data.needs_confirmation && data.confirmation_payload) {
                    showConfirm(data.confirmation_payload, async () => {
                        await executePendingRequest(data);
                    });
                    return;
                }
                
                // Render response
                renderResponse(data);
                
            } catch (error) {
                removeLoading();
                addMessage('网络错误: ' + error.message, 'agent', null, true);
            }
        }
        
        // Execute pending request after confirmation
        async function executePendingRequest(originalData) {
            addLoading();
            
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type: application/json' },
                    body: JSON.stringify({
                        user_input: originalData.user_input || '',
                        user_id: 'web_user',
                        session_id: sessionId,
                        account_id: '2806375919473667',
                        confirmed: true,
                        confirmation_payload: originalData.confirmation_payload
                    })
                });
                
                const data = await response.json();
                removeLoading();
                renderResponse(data);
            } catch (error) {
                removeLoading();
                addMessage('网络错误: ' + error.message, 'agent', null, true);
            }
        }
        
        // Render response
        function renderResponse(data) {
            const tools = data.results?.map(r => ({
                tool: r.tool,
                success: r.success
            })) || [];
            
            addMessage(data.reply || '操作完成', 'agent', tools);
            
            // Show detailed results if available
            if (data.tool_plan && Object.keys(data.tool_plan).length > 0) {
                const details = Object.entries(data.tool_plan)
                    .map(([platform, toolList]) => `${platform}: ${toolList.join(', ')}`)
                    .join('<br>');
                addMessage('<details><summary>工具执行计划</summary><pre>' + details + '</pre></details>', 'agent');
            }
        }
        
        // Initialize
        document.getElementById('userInput').focus();
    </script>
</body>
</html>
